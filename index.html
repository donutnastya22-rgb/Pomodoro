<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Учёба с Pomodoro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone app. Header, scrolling view, bottom tab bar. One calm sand palette, olive as the only accent. */
:root{
  --bg:#F3EDE3; --surface:#E8DFD1; --paper:#FBF8F2;
  --ink:#2B2823; --ink2:#5C554A; --line:#D5C9B6; --track:#DDD2C0;
  --olive:#7A8B5A; --olive-d:#566339; --on-fill:#1A1812;
  --terra:#B86F52; --terra-d:#8E4E35; --amber:#D19A4A;
  --h0:#DDD2C0; --h1:#CFD6B6; --h2:#B5C092; --h3:#98A870; --h4:#7A8B5A; --h5:#566339;
  --own:#DEE3CC;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  font-variant-numeric:tabular-nums;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--olive-d);outline-offset:2px;border-radius:8px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.top{flex:none;display:flex;align-items:center;gap:8px;min-height:64px;padding-top:6px}
.top h1{font-size:28px;font-weight:700;letter-spacing:-.01em;flex:1}
.iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
.iconbtn:disabled{opacity:.35;cursor:default}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:16px;scrollbar-width:thin}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px 0 6px;border-top:1px solid var(--line)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--ink2);min-height:56px}
.nav .pill{width:60px;height:32px;border-radius:16px;display:grid;place-items:center}
.nav svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav button[aria-current="page"] .pill{background:var(--surface)}
.focusing .dim{opacity:.4}
.nb{height:10px;border-radius:5px;background:var(--track);overflow:hidden;margin-top:8px}
.nb i{display:block;height:100%;background:var(--olive);border-radius:5px}
.nmeta{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2);padding-top:6px}
.nmeta .ok{color:var(--olive-d);font-weight:700}
.nitem{padding:8px 0}
.nitem + .nitem{border-top:1px solid var(--line)}
.nrow{display:flex;align-items:center;gap:8px}
.nrow .nn{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.nrow .x{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);border-radius:12px}
.nrow .x svg{width:20px;height:20px}
.nadd{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.banner{display:block;flex:none;width:100%;height:auto;aspect-ratio:160/56;border-radius:18px;image-rendering:pixelated}

/* Timer */
.timer{display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px}
.field{width:100%;height:52px;border-radius:16px;border:1px solid var(--line);background:var(--paper);padding:0 16px;font-size:17px}
.field::placeholder{color:var(--ink2);opacity:1}
.field:disabled{background:var(--surface)}
.recent{display:flex;gap:8px;flex-wrap:wrap;width:100%;min-height:0}
.chip{min-height:36px;padding:0 14px;border-radius:18px;background:var(--surface);font-size:14px;font-weight:500;display:inline-flex;align-items:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ringwrap{position:relative;width:min(78vw,290px);aspect-ratio:1;margin:6px 0 2px}
.ring{width:100%;height:100%;display:block}
.ring .trk{fill:none;stroke:var(--track);stroke-width:12}
.ring .arc{fill:none;stroke:var(--olive);stroke-width:12;stroke-linecap:round;transform:rotate(-90deg);transform-origin:100px 100px}
.ring .in{fill:var(--paper)}
.ringwrap[data-s="paused"] .arc{stroke:var(--terra)}
.ringwrap[data-s="break"] .arc{stroke:var(--amber)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 40px}
.lbl{font-size:20px;font-weight:600;min-height:30px;display:inline-flex;align-items:center;padding:0 14px;border-radius:15px}
.lbl.pause{background:var(--terra);color:var(--on-fill)}
.lbl.brk{background:var(--amber);color:var(--on-fill)}
.clock{font-size:58px;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.sub{font-size:17px;font-weight:500;color:var(--ink2);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:8px;min-height:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--track)}
.dots i.on{background:var(--olive)}
.actions{display:flex;gap:10px;width:100%}
.btn{flex:1;min-height:56px;border-radius:16px;font-size:18px;font-weight:700;display:grid;place-items:center;padding:0 16px;text-align:center}
.btn.primary{background:var(--olive);color:var(--on-fill)}
.btn.pause{background:var(--terra);color:var(--on-fill)}
.btn.brk{background:var(--amber);color:var(--on-fill)}
.btn.ghost{background:var(--surface);color:var(--ink);flex:.7}
.link{min-height:44px;font-size:17px;font-weight:600;display:flex;align-items:center;gap:6px}

/* Settings */
.set{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:20px;padding:6px 16px}
.paper{background:var(--paper)}
.srow{display:flex;align-items:center;gap:12px;min-height:68px;padding:8px 0}
.srow + .srow{border-top:1px solid var(--line)}
.srow .t{flex:1;min-width:0;font-size:17px;font-weight:600}
.srow .t small{display:block;font-size:14px;font-weight:400;color:var(--ink2)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:44px;height:44px;border-radius:14px;background:var(--bg);font-size:22px;font-weight:600;display:grid;place-items:center}
.step input{width:54px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--paper);text-align:center;font-size:17px;font-weight:600}
.sw{width:56px;height:32px;border-radius:16px;background:#C9BEA9;position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--paper);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--olive)}
.sw[aria-checked="true"]::after{transform:translateX(24px)}
.sec{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:10px 4px 0}

/* Calendar */
.yearbar{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.yearbar h2{font-size:22px;font-weight:700;flex:1;text-align:center}
.yearbar .iconbtn{background:var(--surface)}
.cap{min-height:48px;display:flex;align-items:center;font-size:15px;color:var(--ink2);padding:0 4px}
.cap b{color:var(--ink);font-weight:600}
.months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.month{background:var(--surface);border-radius:18px;padding:12px}
.mh{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:8px}
.mh h3{font-size:15px;font-weight:700}
.mh span{font-size:12px;color:var(--ink2);font-weight:500}
.mgrid{display:grid;grid-template-columns:10px repeat(6,minmax(0,1fr));grid-template-rows:repeat(7,auto);gap:3px;align-items:center}
.mgrid .w{font-size:10px;line-height:1;color:var(--ink2);font-weight:500}
.cell{aspect-ratio:1;border-radius:5px;background:var(--h0);width:100%}
.l1{background:var(--h1)}.l2{background:var(--h2)}.l3{background:var(--h3)}.l4{background:var(--h4)}.l5{background:var(--h5)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.cell.sel{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--ink2)}
.legend{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--ink2);margin-top:14px}
.legend i{width:16px;height:16px;border-radius:5px;display:block}

/* Stats */
.stack{display:flex;flex-direction:column;gap:12px}
.box{background:var(--paper);border-radius:20px;padding:14px 16px}
.box h2{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.box .head{display:flex;align-items:center;gap:10px;min-height:40px}
.box .head h2{flex:1}
.plus{width:44px;height:44px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:26px;font-weight:500;color:var(--olive-d)}
.plus:disabled{opacity:.4;cursor:default}
.hint{font-size:14px;color:var(--ink2);padding:4px 0 2px}
.err{font-size:14px;color:var(--terra-d);font-weight:600;padding:4px 0}
.goal{display:flex;align-items:center;gap:10px;min-height:52px}
.goal + .goal{border-top:1px solid var(--line)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--olive-d);flex:none;display:grid;place-items:center;color:var(--on-fill)}
.chk[aria-checked="true"]{background:var(--olive);border-color:var(--olive)}
.chk svg{width:16px;height:16px;opacity:0}
.chk[aria-checked="true"] svg{opacity:1}
.goal .gt{flex:1;min-width:0;font-size:17px;overflow-wrap:anywhere}
.goal.done .gt{text-decoration:line-through;color:var(--ink2)}
.goal .x{width:40px;height:40px;display:grid;place-items:center;color:var(--ink2);border-radius:12px}
.goal .x svg{width:20px;height:20px}
.addrow{display:flex;gap:8px;margin-top:6px}
.addrow .field{height:48px;flex:1;min-width:0}
.addrow .btn{flex:none;min-height:48px;font-size:16px;padding:0 18px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:16px;padding:4px;gap:4px}
.seg button{min-height:44px;border-radius:12px;font-weight:600;text-align:center;display:grid;place-items:center;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.total{display:flex;flex-direction:column;gap:2px}
.total small{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--ink2);text-transform:uppercase}
.total strong{font-size:40px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.chart{position:relative;height:190px;margin:14px 0 4px 44px}
.gl{position:absolute;left:0;right:0;height:1px;background:var(--line)}
.gl span{position:absolute;right:calc(100% + 8px);top:-9px;font-size:12px;color:var(--ink2);white-space:nowrap}
.bars{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.bar{position:relative;height:100%}
.bar i{position:absolute;left:0;right:0;bottom:0;border-radius:8px 8px 3px 3px;background:var(--h3)}
.bar[aria-pressed="true"] i{background:var(--h5)}
.bar.zero i{height:3px!important;background:var(--track)}
.xl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-left:44px}
.xl button{text-align:center;font-size:12px;color:var(--ink2);min-height:44px;line-height:1.25;border-radius:10px}
.xl button b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.xl button[aria-pressed="true"]{background:var(--surface)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.days button{min-height:58px;border-radius:14px;background:var(--surface);text-align:center;display:grid;place-items:center;align-content:center;font-size:12px;color:var(--ink2)}
.days button b{font-size:17px;color:var(--ink);font-weight:700}
.days button[aria-pressed="true"]{background:var(--olive);color:var(--on-fill)}
.days button[aria-pressed="true"] b{color:var(--on-fill)}
.days button:disabled{opacity:.45;cursor:default}
.drow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0}
.drow + .drow{border-top:1px solid var(--line)}
.drow .n{font-size:16px;font-weight:600;overflow-wrap:anywhere}
.drow .v{font-size:16px;font-weight:600}
.drow .b{grid-column:1/-1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.drow .b i{display:block;height:100%;background:var(--olive);border-radius:3px}
.empty{font-size:15px;color:var(--ink2);padding:8px 0}
.dh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:2px}
.dh h2{overflow-wrap:anywhere}
.dh span{font-size:16px;font-weight:700;white-space:nowrap}

/* Chat */
.view.chatmode{display:flex;flex-direction:column;overflow:hidden;padding-bottom:8px}
.msgs{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 10px}
.note{font-size:15px;color:var(--ink2);text-align:center;padding:24px 12px}
.msg{max-width:88%;display:flex;flex-direction:column;gap:3px;align-self:flex-start}
.msg.me{align-self:flex-end}
.msg .who{font-size:13px;font-weight:600;color:var(--ink2);padding:0 6px}
.bubble{display:block;width:100%;background:var(--surface);border-radius:18px 18px 18px 6px;padding:10px 14px;font-size:16px;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--own);border-radius:18px 18px 6px 18px}
.msg .tm{font-size:12px;color:var(--ink2);padding:0 6px}
.msg.me .tm,.msg.me .who{text-align:right}
.sm{display:flex;flex-direction:column;gap:6px;min-width:230px}
.sm .sh{font-size:13px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2)}
.sm .st{font-size:26px;font-weight:700;line-height:1.1}
.sm .sd{border-top:1px solid var(--line);padding-top:6px}
.sm .sd .r{display:flex;justify-content:space-between;gap:10px;font-size:15px}
.sm .sd .r.d{font-weight:700}
.sm .sd .r span:first-child{overflow-wrap:anywhere}
.sm .sd .r.k{color:var(--ink2);font-size:14px}
.confirm{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;font-size:15px;font-weight:600}
.confirm .row{display:flex;gap:8px}
.confirm .btn{min-height:44px;font-size:15px}
.composer{flex:none;display:flex;gap:8px;align-items:center}
.composer .field{height:48px;flex:1;min-width:0}
.send{width:48px;height:48px;border-radius:16px;background:var(--olive);color:var(--on-fill);display:grid;place-items:center;flex:none}
.send svg{width:22px;height:22px}
.share3d{width:100%;min-height:52px;border-radius:16px;background:var(--olive);color:var(--on-fill);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 var(--olive-d);transform:translateY(0);transition:transform .08s,box-shadow .08s;margin-bottom:8px}
.share3d:active{transform:translateY(4px);box-shadow:0 1px 0 var(--olive-d)}
.share3d svg{width:22px;height:22px}
.sheet{background:var(--paper);border-radius:20px;padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:15px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.per{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.per button{min-height:44px;border-radius:12px;background:var(--surface);font-weight:600;font-size:15px;text-align:center;display:grid;place-items:center}
.per button[aria-pressed="true"]{background:var(--olive);color:var(--on-fill)}
.sheet .row{display:flex;gap:8px}
.rng{font-size:14px;color:var(--ink2)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.clock{font-size:50px}.months{gap:8px}.month{padding:10px}}
</style>

<div class="app" id="app">
  <header class="top" id="top"></header>
  <main class="view" id="view"></main>
  <nav class="nav dim" id="nav" aria-label="Разделы"></nav>
</div>

<script>
(function(){
'use strict';

/* ---------- helpers ---------- */
var MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
var MONN=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
var WD=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
var WDF=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
var WDL=['П','В','С','Ч','П','С','В'];
var KEY='pomodoro-sand-v1';
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function pad(n){return String(n).padStart(2,'0');}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseKey(k){var p=String(k).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]);}
function mondayOf(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
function addDays(d,n){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;}
function wdIdx(d){return (d.getDay()+6)%7;}
function num(x){x=Number(x);return isFinite(x)&&x>0?x:0;}
function fmtHMS(sec){sec=Math.round(sec);var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h+':'+pad(m)+':'+pad(s);}
function fmtDur(sec){sec=Math.round(sec);if(sec<60)return sec+' сек';var h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?(h+' ч '+pad(m)+' мин'):(m+' мин');}
function fmtClock(ms){var s=Math.max(0,Math.ceil(ms/1000));return pad(Math.floor(s/60))+':'+pad(s%60);}
function dayLabel(k){var d=parseKey(k);return WDF[wdIdx(d)]+', '+d.getDate()+' '+MON[d.getMonth()];}
function shortDay(k){var d=parseKey(k);return WD[wdIdx(d)]+', '+d.getDate()+' '+MON[d.getMonth()];}
function lvl(sec){if(!sec)return 0;var h=sec/3600;return h>=6?5:h>=4?4:h>=2?3:h>=1?2:1;}

/* ---------- state ---------- */
function defaults(){return {settings:{focus:25,brk:5,longBrk:20,longEvery:4,autoFocus:false,autoBreak:true,wake:true},goals:[],sessions:[],daily:{},recent:[],norms:{total:0,items:[]},updated:0,timer:null};}
function load(){
  var s=defaults();
  try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);Object.keys(s).forEach(function(k){if(o[k]!=null)s[k]=o[k];});}}catch(e){}
  s.settings=Object.assign(defaults().settings,s.settings||{});
  s.norms=Object.assign({total:0,items:[]},s.norms||{});
  return s;
}
var S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function prune(){var ws=dkey(mondayOf(new Date()));S.sessions=(S.sessions||[]).filter(function(x){return x&&x.d>=ws;});}
prune();

var DB=null,UID=null,USER=null,ME=null,syncT=0,syncBusy=false;
function touch(){S.updated=Date.now();save();pushSoon();}
function pushSoon(){if(!DB||!UID)return;clearTimeout(syncT);syncT=setTimeout(push,1500);}
async function push(){
  if(!DB||!UID)return;
  if(syncBusy){syncT=setTimeout(push,1500);return;}
  syncBusy=true;
  try{await DB.doc('data/users/'+UID+'/app').set({settings:S.settings,goals:S.goals,sessions:S.sessions,daily:S.daily,recent:S.recent,norms:S.norms,updated:S.updated});}catch(e){}
  syncBusy=false;
}
async function pull(){
  try{
    var snap=await DB.doc('data/users/'+UID+'/app').get();
    if(snap.exists){
      var r=JSON.parse(JSON.stringify(snap.data()));
      if((r.updated||0)>(S.updated||0)){
        S.settings=Object.assign(defaults().settings,r.settings||{});
        S.goals=r.goals||[];S.sessions=r.sessions||[];S.daily=r.daily||{};S.recent=r.recent||[];S.norms=Object.assign({total:0,items:[]},r.norms||{});S.updated=r.updated;
        prune();idleSync();save();render();
      }else if((S.updated||0)>(r.updated||0)){pushSoon();}
    }else if(S.updated){pushSoon();}
  }catch(e){}
}

/* ---------- timer ---------- */
function mins(p){var s=S.settings;return (p==='focus'?s.focus:(S.timer&&S.timer.long?s.longBrk:s.brk))*60000;}
function fresh(cycle){var T={phase:'focus',run:false,started:false,rem:S.settings.focus*60000,total:S.settings.focus*60000,endAt:0,cycle:cycle||0,task:'',long:false};return T;}
if(!S.timer||typeof S.timer.rem!=='number')S.timer=fresh(0);
function idleSync(){var T=S.timer;if(!T.started&&!T.run){T.total=T.rem=mins(T.phase);}}
var draft='';
var wl=null;
async function wake(){try{if(S.settings.wake&&navigator.wakeLock&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',function(){wl=null;});}}catch(e){wl=null;}}
function unwake(){try{if(wl)wl.release();}catch(e){}wl=null;}
function addSession(task,sec){
  sec=Math.round(sec);if(sec<5)return;
  var d=dkey(new Date());
  S.sessions.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:d,task:task||'Без названия',sec:sec});
  S.daily[d]=(S.daily[d]||0)+sec;
  touch();
}
function remNow(){var T=S.timer;return T.run?Math.max(0,T.endAt-Date.now()):T.rem;}
function startPhase(){
  var T=S.timer;
  if(T.phase==='focus'&&!T.started){
    var v=(draft||'').trim();
    T.task=v||T.task||'Без названия';
    if(v){S.recent=[v].concat((S.recent||[]).filter(function(x){return x!==v;})).slice(0,4);touch();}
  }
  T.started=true;T.run=true;T.endAt=Date.now()+T.rem;
  wake();save();render();
}
function pauseT(){var T=S.timer;T.rem=Math.max(0,T.endAt-Date.now());T.run=false;unwake();save();render();}
function resumeT(){var T=S.timer;T.run=true;T.endAt=Date.now()+T.rem;wake();save();render();}
function stopFocus(){
  var T=S.timer;
  addSession(T.task,(T.total-remNow())/1000);
  unwake();
  var c=T.cycle;S.timer=fresh(c);save();render();
}
function skipBreak(){unwake();var c=S.timer.cycle;S.timer=fresh(c);save();render();}
function complete(){
  var T=S.timer;unwake();
  if(T.phase==='focus'){
    addSession(T.task,T.total/1000);
    var c=T.cycle+1,task=T.task;
    var long=(c%S.settings.longEvery===0);
    S.timer=fresh(c);S.timer.task=task;S.timer.phase='break';S.timer.long=long;
    S.timer.total=S.timer.rem=(long?S.settings.longBrk:S.settings.brk)*60000;
    if(S.settings.autoBreak){S.timer.started=true;S.timer.run=true;S.timer.endAt=Date.now()+S.timer.rem;wake();}
  }else{
    var c2=T.cycle,task2=T.task;
    S.timer=fresh(c2);S.timer.task=task2;
    if(S.settings.autoFocus){S.timer.started=true;S.timer.run=true;S.timer.endAt=Date.now()+S.timer.rem;wake();}
  }
  save();render();
}
function tick(){
  var T=S.timer;if(!T.run)return;
  var r=T.endAt-Date.now();
  if(r<=0){T.rem=0;complete();return;}
  T.rem=r;paintTimer();
}
setInterval(tick,250);

var statsMode='week',statsSel=dkey(new Date());

var normName='',normHrs='',normErr='';
var chatDocs=[],chatStatus='wait',chatErr='',names={},delId=null,shareOpen=false,sharePer=1,chatDraft='',firstPaint=true;

/* ---------- shell ---------- */
var NAV=[['timer','Таймер','clock'],['calendar','Календарь','cal'],['stats','Статистика','bars'],['chat','Чат','chat']];
function renderNav(){
  var cur=view==='settings'?'timer':(view==='normset'?'stats':view);
  $('#nav').innerHTML=NAV.map(function(n){return '<button data-act="nav" data-v="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'><span class="pill">'+ICON[n[2]]+'</span>'+n[1]+'</button>';}).join('');
}
function renderTop(){
  var t=$('#top');
  if(view==='settings'){t.innerHTML='<button class="iconbtn" data-act="nav" data-v="timer" aria-label="Назад">'+ICON.back+'</button><h1>Pomodoro</h1>';return;}
  if(view==='normset'){t.innerHTML='<button class="iconbtn" data-act="nav" data-v="stats" aria-label="Назад">'+ICON.back+'</button><h1>Недельная норма</h1>';return;}
  var title={timer:'Таймер',calendar:'Календарь',stats:'Статистика',chat:'Чат'}[view];
  t.innerHTML='<h1>'+title+'</h1>'+(view==='timer'?'<button class="iconbtn dim" data-act="settings" aria-label="Настройки Pomodoro">'+ICON.gear+'</button>':'')+(view==='stats'?'<button class="iconbtn" data-act="normset" aria-label="Настройки статистики: недельная норма">'+ICON.gear+'</button>':'');
}
function render(){
  prune();
  var T=S.timer;
  document.body.classList.toggle('focusing',!!(T.run&&T.phase==='focus'&&view==='timer'));
  renderNav();renderTop();
  var v=$('#view');
  v.classList.toggle('chatmode',view==='chat');
  if(view==='timer')renderTimer();
  else if(view==='settings')renderSettings();
  else if(view==='normset')renderNorms();
  else if(view==='calendar')renderCalendar();
  else if(view==='stats')renderStats();
  else if(view==='chat')renderChat();
}

/* ---------- timer view ---------- */
var CIRC=2*Math.PI*92;
function tState(){var T=S.timer;if(T.phase==='break')return T.run||!T.started?'break':'paused';return T.started&&!T.run?'paused':'focus';}
function renderTimer(){
  var T=S.timer,st=tState(),locked=T.started&&T.phase==='focus';
  var recent=(S.recent||[]).map(function(r){return '<button class="chip" data-act="recent" data-t="'+esc(r)+'">'+esc(r)+'</button>';}).join('');
  var done=(T.phase==='break'&&T.long)?S.settings.longEvery:T.cycle%S.settings.longEvery;
  var dots='';for(var i=0;i<S.settings.longEvery;i++)dots+='<i class="'+(i<done?'on':'')+'"></i>';
  var a='';
  if(T.phase==='focus'){
    if(!T.started)a='<button class="btn primary" data-act="start">Начать сессию</button>';
    else if(T.run)a='<button class="btn pause" data-act="pause">Пауза</button><button class="btn ghost" data-act="stop">Завершить</button>';
    else a='<button class="btn primary" data-act="resume">Продолжить</button><button class="btn ghost" data-act="stop">Завершить</button>';
  }else{
    if(!T.started)a='<button class="btn brk" data-act="start">Начать перерыв</button><button class="btn ghost" data-act="skip">Пропустить</button>';
    else if(T.run)a='<button class="btn pause" data-act="pause">Пауза</button><button class="btn ghost" data-act="skip">Пропустить</button>';
    else a='<button class="btn brk" data-act="resume">Продолжить</button><button class="btn ghost" data-act="skip">Пропустить</button>';
  }
  $('#view').innerHTML=
   '<div class="timer">'+bannerHtml('dim')+
   '<input id="task" class="field dim" type="text" maxlength="60" placeholder="Над чем работаю…" value="'+esc(locked?T.task:draft)+'"'+(locked?' disabled':'')+' autocomplete="off" aria-label="Над чем работаю">'+
   (recent&&!locked&&T.phase==='focus'?'<div class="recent dim">'+recent+'</div>':'')+
   '<div class="ringwrap" id="ringwrap" data-s="'+st+'"><svg class="ring" viewBox="0 0 200 200" aria-hidden="true"><circle class="trk" cx="100" cy="100" r="92"/><circle class="arc" id="arc" cx="100" cy="100" r="92" stroke-dasharray="'+CIRC.toFixed(2)+'" stroke-dashoffset="0"/><circle class="in" cx="100" cy="100" r="84"/></svg>'+
   '<div class="center"><span class="lbl" id="lbl"></span><div class="clock" id="clock" role="timer"></div><div class="sub" id="sub"></div></div></div>'+
   '<div class="dots dim" aria-label="Сессии в цикле">'+dots+'</div>'+
   '<div class="actions">'+a+'</div>'+
   '<button class="link dim" data-act="settings">Настройки Pomodoro <span aria-hidden="true">›</span></button>'+
   '</div>';
  paintTimer();
}
function paintTimer(){
  if(view!=='timer')return;
  var T=S.timer,st=tState(),rem=remNow();
  var wrap=$('#ringwrap');if(!wrap)return;
  wrap.dataset.s=st;
  var frac=(T.started||T.run)?Math.max(0,Math.min(1,rem/T.total)):1;
  $('#arc').setAttribute('stroke-dashoffset',(CIRC*(1-frac)).toFixed(2));
  $('#clock').textContent=fmtClock(rem);
  var lbl=$('#lbl');
  if(st==='paused'){lbl.className='lbl pause';lbl.textContent='Пауза';}
  else if(T.phase==='break'){lbl.className='lbl brk';lbl.textContent=T.long?'Длинный перерыв':'Перерыв';}
  else{lbl.className='lbl';lbl.textContent='Фокус';}
  var sub='';
  if(T.phase==='focus'){sub=!T.started?'Готовы?':(st==='paused'?'Сессия приостановлена':(T.task||'Идёт сессия'));}
  else{sub=!T.started?'Время отдохнуть':(st==='paused'?'Перерыв приостановлен':'Отдыхаем');}
  $('#sub').textContent=sub;
}

/* ---------- settings ---------- */
var LIM={focus:[1,180,5],brk:[1,60,1],longBrk:[1,90,5],longEvery:[2,10,1]};
function renderSettings(){
  var s=S.settings;
  function row(key,title,unit){
    return '<div class="srow"><div class="t">'+title+'</div><div class="step"><button data-act="step" data-k="'+key+'" data-d="-1" aria-label="Меньше">−</button><input type="text" inputmode="numeric" data-k="'+key+'" value="'+s[key]+'" aria-label="'+title+'"><button data-act="step" data-k="'+key+'" data-d="1" aria-label="Больше">+</button></div></div>';
  }
  function sw(key,title,sub){
    return '<div class="srow"><div class="t">'+title+(sub?'<small>'+sub+'</small>':'')+'</div><button class="sw" role="switch" aria-checked="'+(s[key]?'true':'false')+'" data-act="sw" data-k="'+key+'" aria-label="'+title+'"></button></div>';
  }
  $('#view').innerHTML='<div class="set">'+bannerHtml('')+
   '<div class="card paper" style="background:var(--surface)">'+
   row('focus','Фокус, минут')+row('brk','Перерыв, минут')+row('longBrk','Длинный перерыв, минут')+row('longEvery','Длинный перерыв после, сессий')+
   '</div><div class="sec">Основное</div><div class="card">'+
   sw('autoBreak','Автозапуск перерывов')+sw('autoFocus','Автозапуск фокус-сессий')+sw('wake','Не гасить экран','Пока идёт таймер')+
   '</div></div>';
}
function setVal(key,v){
  var l=LIM[key];v=Math.round(Number(v));if(!isFinite(v))return false;
  v=Math.max(l[0],Math.min(l[1],v));
  S.settings[key]=v;idleSync();touch();return v;
}

/* ---------- calendar ---------- */
function yearTotal(y){var t=0;Object.keys(S.daily).forEach(function(k){if(k.indexOf(y+'-')===0)t+=num(S.daily[k]);});return t;}
function renderCalendar(){
  var Y=calYear,today=dkey(new Date());
  var html='';
  for(var m=0;m<12;m++){
    var first=new Date(Y,m,1),off=wdIdx(first),n=new Date(Y,m+1,0).getDate(),mt=0,cells='';
    for(var i=0;i<7;i++)cells+='<span class="w" style="grid-column:1;grid-row:'+(i+1)+'">'+WDL[i]+'</span>';
    for(var d=1;d<=n;d++){
      var k=Y+'-'+pad(m+1)+'-'+pad(d),sec=num(S.daily[k]),idx=off+d-1,c=Math.floor(idx/7)+2,r=idx%7+1;
      mt+=sec;
      cells+='<button class="cell l'+lvl(sec)+(k===today?' today':'')+(k===calSel?' sel':'')+'" style="grid-column:'+c+';grid-row:'+r+'" data-act="calpick" data-k="'+k+'" aria-label="'+d+' '+MON[m]+', '+(sec?fmtDur(sec):'без занятий')+'"></button>';
    }
    html+='<section class="month"><div class="mh"><h3>'+MONN[m]+'</h3><span>'+(mt?fmtDur(mt):'')+'</span></div><div class="mgrid">'+cells+'</div></section>';
  }
  var sel=parseKey(calSel),selSec=num(S.daily[calSel]);
  var yt=yearTotal(Y);
  $('#view').innerHTML=
   '<div class="yearbar"><button class="iconbtn" data-act="year" data-d="-1" aria-label="Прошлый год"'+(Y<=2026?' disabled':'')+'>'+ICON.prev+'</button><h2>'+Y+'</h2><button class="iconbtn" data-act="year" data-d="1" aria-label="Следующий год"'+(Y>=2040?' disabled':'')+'>'+ICON.next+'</button></div>'+
   '<div class="cap" id="calcap">'+capText(sel,selSec)+'</div>'+
   '<div class="months">'+html+'</div>'+
   '<div class="legend"><span>Меньше</span><i style="background:var(--h0)"></i><i style="background:var(--h1)"></i><i style="background:var(--h2)"></i><i style="background:var(--h3)"></i><i style="background:var(--h4)"></i><i style="background:var(--h5)"></i><span>Больше</span></div>'+
   '<div class="cap" style="justify-content:center;margin-top:6px">За '+Y+' год: <b>&nbsp;'+(yt?fmtDur(yt):'0 мин')+'</b></div>';
}
function capText(d,sec){return '<span><b>'+d.getDate()+' '+MON[d.getMonth()]+' '+d.getFullYear()+'</b> · '+(sec?fmtDur(sec):'без занятий')+'</span>';}

/* ---------- stats ---------- */
function groupTasks(list){var m={};list.forEach(function(s){m[s.task]=(m[s.task]||0)+s.sec;});return Object.keys(m).map(function(k){return {name:k,sec:m[k]};}).sort(function(a,b){return b.sec-a.sec;});}
function dayInfo(k){var l=S.sessions.filter(function(x){return x.d===k;});var t=groupTasks(l);return {tasks:t,total:t.reduce(function(a,x){return a+x.sec;},0)};}
function tasksHtml(tasks,total){
  if(!tasks.length)return '<div class="empty">В этот день занятий нет.</div>';
  return tasks.map(function(t){return '<div class="drow"><span class="n">'+esc(t.name)+'</span><span class="v">'+fmtDur(t.sec)+'</span><span class="b"><i style="width:'+Math.max(4,Math.round(t.sec/total*100))+'%"></i></span></div>';}).join('');
}
function axisLbl(sec){return sec===0?'0':(sec%3600===0?(sec/3600)+' ч':Math.round(sec/60)+' мин');}
function renderGoals(){
  var g=S.goals||[],full=g.length>=4;
  var list=g.map(function(x){
    return '<div class="goal'+(x.done?' done':'')+'"><button class="chk" role="checkbox" aria-checked="'+(x.done?'true':'false')+'" data-act="goaldone" data-id="'+esc(x.id)+'" aria-label="Отметить цель">'+ICON.check+'</button><span class="gt">'+esc(x.text)+'</span><button class="x" data-act="goaldel" data-id="'+esc(x.id)+'" aria-label="Удалить цель">'+ICON.x+'</button></div>';
  }).join('');
  var form=goalOpen&&!full?'<div class="addrow"><input id="goalin" class="field" type="text" maxlength="80" placeholder="Одна важная цель" value="'+esc(goalDraft)+'" autocomplete="off" aria-label="Новая цель"><button class="btn primary" data-act="goalsave">Добавить</button></div>':'';
  var hint=!g.length&&!goalOpen?'<div class="hint">Выберите до 4 самых важных целей. Остальное подождёт.</div>':(full?'<div class="hint">Все 4 места заняты. Закройте одну цель, чтобы добавить новую.</div>':'');
  return '<section class="box"><div class="head"><h2>Цели ('+g.length+'/4)</h2><button class="plus" data-act="goaladd"'+(full?' disabled':'')+' aria-label="Добавить цель">+</button></div>'+list+hint+form+(goalErr?'<div class="err" role="alert">'+esc(goalErr)+'</div>':'')+'</section>';
}
function renderStats(){
  var today=new Date(),ws=mondayOf(today),days=[];
  for(var i=0;i<7;i++){var d=addDays(ws,i),k=dkey(d);days.push({k:k,d:d,i:i,info:dayInfo(k),future:k>dkey(today)});}
  if(statsSel<days[0].k||statsSel>days[6].k)statsSel=dkey(today);
  var sel=days.filter(function(x){return x.k===statsSel;})[0];
  var wt=days.reduce(function(a,x){return a+x.info.total;},0);
  var html='<div class="stack">'+renderGoals()+
    '<div class="seg" role="group" aria-label="Период"><button data-act="mode" data-m="day" aria-pressed="'+(statsMode==='day')+'">День</button><button data-act="mode" data-m="week" aria-pressed="'+(statsMode==='week')+'">Неделя</button></div>';
  var detail='<section class="box"><div class="dh"><h2>'+dayLabel(sel.k)+'</h2><span>'+(sel.info.total?fmtHMS(sel.info.total):'0:00:00')+'</span></div>'+tasksHtml(sel.info.tasks,sel.info.total)+'</section>';
  if(statsMode==='day'){
    html+='<div class="days" role="group" aria-label="День недели">'+days.map(function(x){return '<button data-act="pick" data-k="'+x.k+'" aria-pressed="'+(x.k===statsSel)+'"'+(x.future?' disabled':'')+'>'+WD[x.i]+'<b>'+x.d.getDate()+'</b></button>';}).join('')+'</div>'+detail;
  }else{
    var max=Math.max.apply(null,days.map(function(x){return x.info.total;}));
    var topH=Math.max(1,Math.ceil(max/3600));if(topH>4&&topH%2)topH++;
    var top=topH*3600;
    var half=topH%2===0?top/2:1800*topH;
    var ticks=[0,top/2,top];
    var grid=ticks.map(function(t){return '<div class="gl" style="bottom:'+(t/top*100)+'%"><span>'+axisLbl(Math.round(t))+'</span></div>';}).join('');
    var bars=days.map(function(x){var h=x.info.total/top*100;return '<button class="bar'+(x.info.total?'':' zero')+'" data-act="pick" data-k="'+x.k+'" aria-pressed="'+(x.k===statsSel)+'" aria-label="'+dayLabel(x.k)+', '+(x.info.total?fmtDur(x.info.total):'без занятий')+'"><i style="height:'+h+'%"></i></button>';}).join('');
    var xl=days.map(function(x){return '<button data-act="pick" data-k="'+x.k+'" aria-pressed="'+(x.k===statsSel)+'">'+WD[x.i]+'<b>'+x.d.getDate()+'</b></button>';}).join('');
    var all=[];days.forEach(function(x){all=all.concat(S.sessions.filter(function(s){return s.d===x.k;}));});
    var wtasks=groupTasks(all);
    html+='<section class="box"><div class="total"><small>Всего за неделю</small><strong>'+fmtHMS(wt)+'</strong></div>'+
      '<div class="chart" role="group" aria-label="Время по дням">'+grid+'<div class="bars">'+bars+'</div></div><div class="xl">'+xl+'</div></section>'+
      detail+
      '<section class="box"><div class="dh"><h2>На что ушла неделя</h2></div>'+tasksHtml(wtasks,wt)+'</section>';
  }
  html+='<p class="hint" style="text-align:center">Статистика сбрасывается в понедельник. Прошлые недели остаются цветом в календаре.</p></div>';
  $('#view').innerHTML=html;
}

/* ---------- weekly norms (only on the settings screen inside Statistics) ---------- */
function normSec(name){var k=String(name).trim().toLowerCase();return S.sessions.reduce(function(a,x){return String(x.task).trim().toLowerCase()===k?a+num(x.sec):a;},0);}
function weekAllSec(){return S.sessions.reduce(function(a,x){return a+num(x.sec);},0);}
function fmtH(h){return String(Math.round(h*10)/10).replace('.',',')+' ч';}
function normBar(sec,h){
  var goal=h*3600,p=Math.min(100,Math.round(sec/goal*100)),done=sec>=goal;
  return '<div class="nb" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div>'+
    '<div class="nmeta"><span>'+(sec?fmtDur(sec):'0 мин')+' из '+fmtH(h)+'</span><span'+(done?' class="ok"':'')+'>'+(done?'Норма выполнена':p+'%')+'</span></div>';
}
function addNorm(){
  var n=(normName||'').trim(),h=parseFloat(String(normHrs).replace(',','.'));
  if(!n){normErr='Напишите название предмета.';render();return;}
  if(!(h>0)||h>100){normErr='Укажите, сколько часов в неделю: число больше 0.';render();return;}
  var dup=S.norms.items.some(function(x){return x.name.trim().toLowerCase()===n.toLowerCase();});
  if(dup){normErr='Для этого предмета норма уже есть. Удалите её, чтобы задать заново.';render();return;}
  if(S.norms.items.length>=10){normErr='Можно задать норму не больше чем для 10 предметов.';render();return;}
  S.norms.items.push({id:Date.now().toString(36),name:n,h:Math.round(h*10)/10});
  normName='';normHrs='';normErr='';touch();render();
}
function renderNorms(){
  var N=S.norms,items=N.items||[],total=N.total||0;
  var used={};items.forEach(function(x){used[x.name.trim().toLowerCase()]=1;});
  var sug=[];
  (S.recent||[]).concat(S.sessions.map(function(x){return x.task;})).forEach(function(n){
    var k=String(n).trim().toLowerCase();
    if(k&&k!=='без названия'&&!used[k]&&sug.map(function(s){return s.toLowerCase();}).indexOf(k)<0)sug.push(String(n).trim());
  });
  sug=sug.slice(0,6);
  var list=items.map(function(x){
    return '<div class="nitem"><div class="nrow"><span class="nn">'+esc(x.name)+'</span><button class="x" data-act="ndel" data-id="'+esc(x.id)+'" aria-label="Удалить норму: '+esc(x.name)+'">'+ICON.x+'</button></div>'+normBar(normSec(x.name),x.h)+'</div>';
  }).join('');
  $('#view').innerHTML='<div class="stack">'+
    '<p class="hint">Эти шкалы видны только здесь. В обычной статистике их нет.</p>'+
    '<section class="box"><div class="head"><h2>Общая норма</h2></div>'+
      '<div class="srow" style="min-height:60px"><div class="t" style="font-size:16px;font-weight:600">Часов в неделю<small style="font-size:14px;font-weight:400;color:var(--ink2);display:block">0 — без нормы</small></div>'+
      '<div class="step"><button data-act="ntstep" data-d="-1" aria-label="Меньше">−</button><input type="text" inputmode="decimal" data-n="total" value="'+String(total).replace('.',',')+'" aria-label="Общая норма, часов в неделю"><button data-act="ntstep" data-d="1" aria-label="Больше">+</button></div></div>'+
      (total>0?normBar(weekAllSec(),total):'')+
    '</section>'+
    '<section class="box"><div class="head"><h2>По предметам</h2></div>'+
      (list||'<div class="empty">Пока нет норм по предметам.</div>')+
      '<div class="nadd"><input id="nname" class="field" type="text" maxlength="60" placeholder="Предмет, например Физика" value="'+esc(normName)+'" autocomplete="off" aria-label="Название предмета">'+
      (sug.length?'<div class="recent">'+sug.map(function(s){return '<button class="chip" data-act="nname" data-t="'+esc(s)+'">'+esc(s)+'</button>';}).join('')+'</div>':'')+
      '<div class="addrow"><input id="nhrs" class="field" type="text" inputmode="decimal" maxlength="5" placeholder="Часов в неделю" value="'+esc(normHrs)+'" autocomplete="off" aria-label="Часов в неделю"><button class="btn primary" data-act="nadd">Добавить</button></div>'+
      (normErr?'<div class="err" role="alert">'+esc(normErr)+'</div>':'')+
      '<p class="hint">Шкала считает время только с тем же названием, которое вы пишете в таймере в поле «Над чем работаю». Регистр букв не важен.</p></div>'+
    '</section></div>';
}

/* ---------- chat ---------- */
function renderChat(){
  $('#view').innerHTML='<div class="msgs" id="msgs" aria-live="polite"></div><div id="sharePanel"></div>'+
    '<div class="composer"><input id="chatIn" class="field" type="text" maxlength="500" placeholder="Сообщение" value="'+esc(chatDraft)+'" autocomplete="off" aria-label="Сообщение"><button class="send" data-act="send" aria-label="Отправить">'+ICON.send+'</button></div>';
  firstPaint=true;paintMsgs();paintShare();
}
function fmtTime(ts){
  var d=new Date(ts),n=new Date(),t=pad(d.getHours())+':'+pad(d.getMinutes());
  return dkey(d)===dkey(n)?t:(d.getDate()+' '+MON[d.getMonth()]+', '+t);
}
function statsMsgHtml(st){
  var days=Array.isArray(st.days)?st.days:[];
  var h='<div class="sm"><div class="sh">Статистика · '+esc(st.p||'')+'</div><div class="st">'+fmtHMS(num(st.total))+'</div>';
  days.forEach(function(d){
    var tasks=Array.isArray(d.tasks)?d.tasks:[];
    h+='<div class="sd"><div class="r d"><span>'+esc(shortDay(String(d.d)))+'</span><span>'+(num(d.t)?fmtDur(num(d.t)):'—')+'</span></div>'+
      tasks.map(function(t){return '<div class="r k"><span>'+esc(t.n)+'</span><span>'+fmtDur(num(t.s))+'</span></div>';}).join('')+'</div>';
  });
  return h+'</div>';
}
function paintMsgs(){
  var box=$('#msgs');if(!box||view!=='chat')return;
  var near=firstPaint||(box.scrollHeight-box.scrollTop-box.clientHeight<80);
  var h='';
  if(!DB&&chatStatus==='off')h='<div class="note">Чат недоступен в этом режиме просмотра. Откройте приложение со своей учётной записью.</div>';
  else if(chatStatus==='error')h='<div class="note" style="color:var(--terra-d);font-weight:600">Не удалось подключиться к чату. Закройте и откройте приложение ещё раз.</div>';
  else if(chatStatus==='wait'||chatStatus==='slow')h='<div class="note">'+(chatStatus==='slow'?'Чат пока не отвечает. Проверьте интернет.':'Подключаем чат…')+'</div>';
  else if(!chatDocs.length)h='<div class="note">Пока тихо. Напишите первое сообщение или поделитесь статистикой.</div>';
  chatDocs.forEach(function(m){
    var mine=m.uid&&m.uid===UID;
    var body=m.kind==='stats'&&m.stats&&typeof m.stats==='object'?statsMsgHtml(m.stats):esc(m.text||'');
    var conf=(delId===m.id)?'<div class="confirm"><span>Точно ли вы хотите удалить сообщение? Оно исчезнет у всех.</span><div class="row"><button class="btn pause" data-act="delyes" data-id="'+esc(m.id)+'">Да, удалить</button><button class="btn ghost" data-act="delno">Отмена</button></div></div>':'';
    var inner=mine?'<button class="bubble" data-act="delask" data-id="'+esc(m.id)+'" aria-label="Своё сообщение. Нажмите, чтобы удалить">'+body+'</button>':'<div class="bubble">'+body+'</div>';
    if(mine&&conf)inner='<div class="bubble">'+body+conf+'</div>';
    h+='<div class="msg'+(mine?' me':'')+'">'+(mine?'':'<span class="who">'+esc(names[m.uid]||'Участник')+'</span>')+inner+'<span class="tm">'+fmtTime(num(m.ts))+'</span></div>';
  });
  if(chatErr)h+='<div class="err" role="alert" style="text-align:center">'+esc(chatErr)+'</div>';
  box.innerHTML=h;
  if(near)box.scrollTop=box.scrollHeight;
  firstPaint=false;
}
var PER=[[1,'День'],[3,'3 дня'],[5,'5 дней'],[7,'Неделя']];
function buildStats(n){
  var today=new Date(),maxBack=wdIdx(today)+1;
  var count=n===7?maxBack:Math.min(n,maxBack);
  var start=addDays(today,-(count-1)),days=[],total=0;
  for(var i=0;i<count;i++){var k=dkey(addDays(start,i)),inf=dayInfo(k);total+=inf.total;days.push({d:k,t:inf.total,tasks:inf.tasks.map(function(x){return {n:x.name,s:x.sec};})});}
  var lab=PER.filter(function(p){return p[0]===n;})[0][1];
  return {p:lab,total:total,days:days,from:dkey(start),to:dkey(today)};
}
function paintShare(){
  var p=$('#sharePanel');if(!p)return;
  var canSend=!!(DB&&UID&&chatStatus==='ready');
  var h='';
  if(shareOpen){
    var st=buildStats(sharePer);
    h='<div class="sheet"><h2>Какой период отправить</h2><div class="per">'+PER.map(function(x){return '<button data-act="per" data-n="'+x[0]+'" aria-pressed="'+(x[0]===sharePer)+'">'+x[1]+'</button>';}).join('')+'</div>'+
      '<div class="rng">'+esc(st.from===st.to?dayLabel(st.from):shortDay(st.from)+' — '+shortDay(st.to))+' · '+fmtHMS(st.total)+'</div>'+
      '<div class="row"><button class="btn primary" data-act="shareok"'+(canSend?'':' disabled style="opacity:.5"')+'>Отправить в чат</button><button class="btn ghost" data-act="shareno">Отмена</button></div></div>';
  }else{
    h='<button class="share3d" data-act="shareopen">'+ICON.share+'Поделиться статистикой</button>';
  }
  p.innerHTML=h;
}
async function resolveNames(){
  var ids={};chatDocs.forEach(function(m){if(m.uid&&m.uid!==UID)ids[m.uid]=1;});
  var list=Object.keys(ids);if(!list.length||!USER)return;
  try{var ps=await USER.profiles(list);list.forEach(function(id){names[id]=(ps[id]&&ps[id].name)||'Участник';});}catch(e){}
}
function subscribeChat(){
  var t=setTimeout(function(){if(chatStatus==='wait'){chatStatus='slow';paintMsgs();}},10000);
  DB.collection('chat').orderBy('ts','desc').limit(150).onSnapshot(async function(snap){
    clearTimeout(t);
    chatDocs=snap.docs.map(function(d){var o=d.data()||{};o.id=d.id;return o;}).reverse();
    chatStatus='ready';
    await resolveNames();
    paintMsgs();paintShare();
  },function(){clearTimeout(t);chatStatus='error';paintMsgs();});
}
async function sendMsg(obj){
  chatErr='';
  if(!DB||!UID){chatErr='Чтобы писать в чат, нужна учётная запись.';paintMsgs();return false;}
  try{await DB.collection('chat').add(Object.assign({uid:UID,ts:Date.now()},obj));return true;}
  catch(e){chatErr='Сообщение не отправилось. Проверьте интернет и доступ к приложению.';paintMsgs();return false;}
}

/* ---------- events ---------- */
document.addEventListener('click',async function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.dataset.act;
  switch(act){
    case 'nav':view=el.dataset.v;if(view==='calendar')calYear=Math.max(2026,Math.min(2040,new Date().getFullYear()));render();break;
    case 'settings':view='settings';render();break;
    case 'start':startPhase();break;
    case 'pause':pauseT();break;
    case 'resume':resumeT();break;
    case 'stop':stopFocus();break;
    case 'skip':skipBreak();break;
    case 'recent':draft=el.dataset.t;var ti=$('#task');if(ti)ti.value=draft;break;
    case 'step':{var k=el.dataset.k,l=LIM[k];setVal(k,S.settings[k]+l[2]*Number(el.dataset.d));var inp=$('input[data-k="'+k+'"]');if(inp)inp.value=S.settings[k];break;}
    case 'sw':{var kk=el.dataset.k;S.settings[kk]=!S.settings[kk];touch();el.setAttribute('aria-checked',S.settings[kk]?'true':'false');if(kk==='wake'){if(S.settings.wake&&S.timer.run)wake();else unwake();}break;}
    case 'year':calYear=Math.max(2026,Math.min(2040,calYear+Number(el.dataset.d)));render();break;
    case 'calpick':calSel=el.dataset.k;{var cap=$('#calcap');if(cap)cap.innerHTML=capText(parseKey(calSel),num(S.daily[calSel]));document.querySelectorAll('.cell.sel').forEach(function(c){c.classList.remove('sel');});el.classList.add('sel');}break;
    case 'mode':statsMode=el.dataset.m;render();break;
    case 'pick':statsSel=el.dataset.k;render();break;
    case 'goaladd':goalOpen=!goalOpen;goalErr='';render();if(goalOpen){var gi=$('#goalin');if(gi)gi.focus();}break;
    case 'goalsave':saveGoal();break;
    case 'goaldone':{var g=S.goals.filter(function(x){return x.id===el.dataset.id;})[0];if(g){g.done=!g.done;touch();render();}break;}
    case 'goaldel':S.goals=S.goals.filter(function(x){return x.id!==el.dataset.id;});goalErr='';touch();render();break;
    case 'normset':view='normset';render();break;
    case 'ntstep':{S.norms.total=Math.max(0,Math.min(100,Math.round(((S.norms.total||0)+Number(el.dataset.d))*10)/10));touch();render();break;}
    case 'nname':normName=el.dataset.t;render();break;
    case 'nadd':addNorm();break;
    case 'ndel':S.norms.items=S.norms.items.filter(function(x){return x.id!==el.dataset.id;});touch();render();break;
    case 'send':doSend();break;
    case 'shareopen':shareOpen=true;paintShare();break;
    case 'shareno':shareOpen=false;paintShare();break;
    case 'per':sharePer=Number(el.dataset.n);paintShare();break;
    case 'shareok':{var ok=await sendMsg({kind:'stats',text:'',stats:buildStats(sharePer)});if(ok){shareOpen=false;paintShare();}break;}
    case 'delask':delId=(delId===el.dataset.id)?null:el.dataset.id;paintMsgs();break;
    case 'delno':delId=null;paintMsgs();break;
    case 'delyes':{var id=el.dataset.id;delId=null;try{await DB.collection('chat').doc(id).delete();chatErr='';}catch(er){chatErr='Не удалось удалить сообщение. Попробуйте ещё раз.';}paintMsgs();break;}
  }
});
function saveGoal(){
  var inp=$('#goalin'),v=(inp?inp.value:goalDraft).trim();
  if(!v){goalErr='Напишите цель, чтобы добавить её.';render();return;}
  if(S.goals.length>=4){goalErr='Можно держать не больше 4 целей.';render();return;}
  S.goals.push({id:Date.now().toString(36),text:v,done:false});
  goalDraft='';goalErr='';goalOpen=false;touch();render();
}
async function doSend(){
  var inp=$('#chatIn');if(!inp)return;
  var v=inp.value.trim();if(!v)return;
  inp.value='';chatDraft='';
  var ok=await sendMsg({kind:'text',text:v});

}
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='task')draft=t.value;
  else if(t.id==='goalin')goalDraft=t.value;
  else if(t.id==='chatIn')chatDraft=t.value;
  else if(t.id==='nname')normName=t.value;
  else if(t.id==='nhrs')normHrs=t.value;
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches&&t.matches('input[data-k]')){var r=setVal(t.dataset.k,t.value);t.value=r===false?S.settings[t.dataset.k]:r;}
  else if(t.dataset&&t.dataset.n==='total'){
    var tv=parseFloat(String(t.value).replace(',','.'));

document.addEventListener('keydown',function(e){

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){if(S.timer.run)wake();tick();if(view!=='timer'&&view!=='chat')render();}
});

/* ---------- pixel banner: two panels, 80x56 px each ---------- */
function makeBanner(){
  var c=document.createElement('canvas');c.width=160;c.height=56;
  var g=c.getContext('2d'),OX=0;
  function R(x,y,w,h,col){g.fillStyle=col;g.fillRect(OX+x,y,w,h);}
  function sky(cols){
    for(var y=0;y<48;y++){var b=Math.min(cols.length-1,Math.floor(y/8));
      for(var x=0;x<80;x++){var col=cols[b];if(y%8===7&&b<cols.length-1&&(x+y)%2===0)col=cols[b+1];R(x,y,1,1,col);}}
  }
  function mount(peaks,slope,base,col,snowY,snowCol){
    for(var x=0;x<80;x++){
      var top=base;
      peaks.forEach(function(p){var t=p[1]+Math.abs(x-p[0])*slope;if(t<top)top=t;});
      top=Math.floor(top);
      if(top<base){R(x,top,1,base-top,col);if(snowY&&top<snowY)R(x,top,1,snowY-top,snowCol);}
    }
  }
  function spr(rows,pal,x,y){
    for(var j=0;j<rows.length;j++){var r=rows[j];
      for(var i=0;i<r.length;i++){var ch=r.charAt(i);if(ch!=='.'&&pal[ch])R(x+i,y+j,1,1,pal[ch]);}}
  }
  function flag(x,y){
    var wave=[0,0,1,1,1,0,0,-1,-1,-1,0,0,1,1,1,0];
    for(var i=0;i<16;i++)R(x+i,y+wave[i],1,10,'#D43B2F');
    function dot(i,j){R(x+i,y+wave[i]+j,1,1,'#FFFFFF');}
    for(var j=0;j<10;j++)for(var i=0;i<16;i++){
      var dy=j-4.5,d1=(i-5)*(i-5)+dy*dy,d2=(i-6.3)*(i-6.3)+dy*dy;
      if(d1<=9.5&&d2>6.8)dot(i,j);
    }
    [[10,3],[9,4],[10,4],[11,4],[10,5]].forEach(function(p){dot(p[0],p[1]);});
  }
  function stat(x,y){
    R(x+1,y,2,2,'#F4EEE2');R(x,y+2,4,6,'#F4EEE2');R(x+3,y+2,1,6,'#CFC6B5');
    R(x-1,y+3,1,3,'#F4EEE2');R(x+4,y+1,1,3,'#F4EEE2');R(x,y+8,4,2,'#E4DCCB');
  }
  function dome(cx,y){
    R(cx,y,1,2,'#D9A441');R(cx-1,y+2,3,1,'#D9A441');R(cx-2,y+3,5,2,'#D9A441');R(cx-1,y+5,3,1,'#B8872F');
    R(cx-1,y+6,3,12,'#B84A3C');
  }

  /* left panel: Trabzon, mountains and a university */
